<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark;--bg:#0b0b18;--card:#131324;--panel:#151530;--border:#1e1e36;--text:#ddd;--dim:#555;--accent:#818cf8;--green:#22c55e;--red:#dc2626;--amber:#f59e0b;--gold:#fbbf24}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:430px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{padding:14px 14px 6px;padding-top:calc(env(safe-area-inset-top,20px) + 10px);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.logo{font:800 19px 'Courier New',monospace;color:#eee;letter-spacing:-0.5px}
.date-chip{font-size:12px;color:#888;background:var(--card);padding:5px 12px;border-radius:20px}
.date-nav{display:flex;justify-content:center;gap:8px;padding:6px 14px 12px;flex-shrink:0}
.date-btn{background:var(--card);border:none;color:#888;font-size:14px;padding:6px 16px;border-radius:8px;font-weight:600}
.date-btn.today-glow{border:1.5px solid var(--gold);color:var(--gold);box-shadow:0 0 8px #fbbf2433}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,20px)}
.day-card{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 12px;margin-bottom:5px;border-radius:10px;border:none;background:var(--card);cursor:pointer;text-align:left}
.day-left{display:flex;align-items:center;gap:10px;flex:1}
.day-name{font-size:13px;font-weight:700;color:#ddd}
.day-num{font-size:11px;color:var(--dim);margin-top:1px}
.day-right{display:flex;align-items:center;gap:8px}
.ex-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.ex-btn{flex:1;display:flex;align-items:center;padding:11px 10px;border-radius:8px;border:none;cursor:pointer;background:#111122;text-align:left}
.ex-name{font-size:13px;font-weight:600;color:#ddd}
.ex-rx{font-size:11px;color:var(--dim);margin-top:2px;font-family:monospace}
.ex-preview{font-size:10px;color:#4a4a6a;margin-top:3px;font-family:monospace}
.ex-panel{padding:10px;background:var(--panel);border-radius:0 0 8px 8px;margin-top:-7px;margin-bottom:5px}
.ref-box{background:#0c0c1a;border-radius:8px;padding:8px 10px;margin-bottom:10px;border-left:2px solid #252540;font-size:11px;color:#888}
.ref-box .label{font-size:9px;color:#555;letter-spacing:1px;font-weight:700;margin-bottom:3px}
.ref-box .vals{font-family:monospace;font-size:12px}
.ref-box .pr{color:var(--amber)}
.set-tabs{display:flex;gap:3px;margin-bottom:10px}
.set-tab{border:none;padding:6px 12px;border-radius:6px 6px 0 0;cursor:pointer;font:600 12px monospace;background:#0e0e1e;color:#444;border-bottom:2px solid transparent}
.set-tab.active{background:#2a2a4a;color:#fff;border-bottom-color:var(--accent)}
.set-tab.done{background:#142014;color:var(--green)}
.field-label{font:700 10px/1 sans-serif;color:var(--dim);letter-spacing:1.5px;margin-bottom:6px;display:block;margin-top:10px}
.field-label:first-child{margin-top:0}
.quick-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.q-btn{border:none;padding:9px 12px;border-radius:8px;cursor:pointer;font:400 13px monospace;min-width:40px;text-align:center;background:#141428;color:#888;transition:background .1s}
.q-btn.on{background:var(--accent);color:#fff;font-weight:700}
.inp{width:100%;background:#0c0c1a;border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font:15px monospace;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{font:14px -apple-system,sans-serif;resize:vertical}
.next-btn{width:100%;background:var(--accent);border:none;color:#fff;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:0.3px;margin-top:8px}
.quick-done{margin-top:8px;width:100%;background:#0c1a0c;border:1px solid #22c55e20;color:var(--green);padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.note-toggle{background:none;border:none;color:#555;font-size:12px;cursor:pointer;padding:6px 0}
.add-btn{width:100%;background:none;border:1px dashed #282838;color:#666;padding:12px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px}
.add-panel{background:var(--card);border-radius:12px;padding:14px;margin-top:6px}
.custom-add{background:#f59e0b12;border:1px solid #f59e0b30;color:var(--amber);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;text-align:left}
.extra-opt{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;border-bottom:1px solid #181830;color:#bbb;padding:10px 4px;font-size:13px;cursor:pointer;text-align:left}
.extra-tag{font-size:8px;color:var(--amber);background:#f59e0b15;padding:1px 5px;border-radius:4px;font-weight:700;margin-left:6px}
.vol-toggle{display:block;margin:10px auto;background:none;border:1px solid #222;color:#666;font-size:12px;padding:6px 16px;border-radius:20px;cursor:pointer;font-weight:500}
.vol-card{margin:6px 14px;padding:14px;background:var(--card);border-radius:12px}
.vol-row{margin-bottom:8px}
.vol-header{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.vol-bar{height:5px;background:#1a1a2e;border-radius:3px;overflow:hidden}
.vol-fill{height:100%;border-radius:3px;transition:width 0.3s}
.sess-head{padding:12px 14px;padding-top:calc(env(safe-area-inset-top,20px) + 10px);display:flex;align-items:center;gap:10px;border-bottom:1px solid #181830;flex-shrink:0}
.back-btn{background:none;border:none;color:var(--accent);font-size:16px;cursor:pointer;padding:4px 8px;font-weight:700}
.rest-bar{margin:0 10px 8px;background:#141428;border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.rest-time{font:800 22px monospace;color:var(--accent)}
.rest-time.warn{color:var(--red)}
.rest-btns{display:flex;gap:6px}
.rest-btn{background:#1e1e36;border:none;color:#888;padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer}
.rest-btn.on{background:var(--accent);color:#fff}
.rest-btn.stop{background:#261616;color:var(--red)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:10px 24px;border-radius:24px;font-size:13px;font-weight:700;z-index:100;box-shadow:0 4px 20px rgba(34,197,94,0.3);animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.data-panel{margin:0 14px 10px;padding:14px;background:var(--card);border-radius:12px;border:1px solid var(--border)}
.data-btn{flex:1;background:#141428;border:1px solid #2a2a4a;color:var(--accent);padding:10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.remove-btn{margin-top:10px;width:100%;background:none;border:1px solid #331a1a;color:var(--red);font-size:12px;padding:8px;border-radius:8px;cursor:pointer}
.cardio-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.cardio-field{display:flex;flex-direction:column;gap:4px}
.cardio-field label{font:700 9px sans-serif;color:var(--dim);letter-spacing:1px}
.cardio-field .inp{font-size:14px;padding:8px 10px}
.reorder-btn{background:#1a1a2e;border:none;color:#666;font-size:16px;padding:4px 8px;border-radius:6px;cursor:pointer;line-height:1;flex-shrink:0}
.reorder-btn:active{background:var(--accent);color:#fff}
.reorder-toggle{background:none;border:1px solid #282838;color:#666;padding:6px 12px;border-radius:8px;font-size:11px;cursor:pointer;font-weight:600}
.reorder-toggle.on{border-color:var(--accent);color:var(--accent)}
.prog-bar{display:flex;align-items:center;gap:8px;width:calc(100% - 28px);margin:0 14px 8px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;cursor:pointer;text-align:left}
.prog-bar .plabel{font-size:9px;color:#666;letter-spacing:1.5px;font-weight:700;margin-bottom:2px}
.prog-bar .pname{font-size:14px;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-btn{background:#1a1a2e;border:none;color:#888;font-size:13px;padding:6px 10px;border-radius:7px;cursor:pointer;font-weight:600;flex-shrink:0}
.mini-btn:active{background:var(--accent);color:#fff}
.mini-btn.del{color:var(--red)}
.mini-btn.del:active{background:var(--red);color:#fff}
.block-bar{width:calc(100% - 28px);margin:0 14px 8px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px}
.block-select{background:#0c0c1a;border:1px solid var(--border);color:var(--gold);font:700 12px monospace;padding:6px 8px;border-radius:8px;outline:none;max-width:62%}
.block-note{font-size:10px;color:#8a8aa0;line-height:1.5}
.info-btn{flex-shrink:0;width:34px;align-self:stretch;display:flex;align-items:center;justify-content:center;background:#111122;border:1px solid #24243e;border-radius:8px;color:#8a8ab0;font-size:17px;line-height:1;cursor:pointer;padding:0}
.info-btn:active{background:var(--accent);border-color:var(--accent);color:#fff}
.set-actions{display:flex;gap:6px;margin-top:6px}
.sec-btn{flex:1;background:#141428;border:1px solid #2a2a4a;color:var(--accent);padding:11px 8px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
.sec-btn:active{background:var(--accent);color:#fff}
.modal-scrim{position:fixed;inset:0;background:rgba(4,4,12,0.72);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:scrimIn .15s}
.modal-card{width:100%;max-width:430px;max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--border);border-bottom:none;border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,20px) + 20px);box-shadow:0 -8px 40px rgba(0,0,0,0.5);animation:sheetIn .18s ease-out}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:2px}
.modal-title{font-size:16px;font-weight:800;color:#eee;line-height:1.25}
.modal-x{flex-shrink:0;background:#1a1a2e;border:none;color:#999;width:30px;height:30px;border-radius:8px;font-size:15px;cursor:pointer}
.modal-sec{margin-top:14px}
.modal-sec .ml{font:700 10px sans-serif;color:var(--dim);letter-spacing:1.5px;margin-bottom:5px}
.modal-sec .mb{font-size:13px;color:#cfcfe0;line-height:1.6}
.modal-note{font-size:13px;color:#d5d5e6;line-height:1.55;background:#0c0c1a;border-left:2px solid #303052;border-radius:6px;padding:7px 10px;margin-bottom:5px}
.modal-empty{font-size:12px;color:#666;font-style:italic;line-height:1.5}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>

// Old defaults + common extras (all available via + Add Exercise)
const COMMON_EXTRAS=["Seated Cable Row","Wide-Grip Cable Pulldown","Kneeling Cable Lat Pulldown","Cable Shrugs","Chest-Supported Row","Lat Pulldown","DB Shrugs","Landmine Press","Face Pulls","Cable Crossover","Hammer Curl","Preacher Curl","Barbell Curl","Skull Crushers","Dips","Close-Grip Bench","Arnold Press","Seated DB Overhead Press","DB Lateral Raise","Upright Row","Cable Fly","Parallel-Bar Dips","Barbell Row","T-Bar Row","Pendlay Row","Front Squat","Hack Squat","Leg Press","Hip Thrust","Bulgarian Split Squat","Sumo Deadlift","Conventional Deadlift","Hex-Bar Deadlift","Good Morning","Smith Machine Good Morning","Box / Squat Jumps","Glute Ham Raise","Cable Crunch","Hanging Leg Raise","Ab Wheel","Farmer's Walk","Incline Walk","Stairmaster","Rowing Machine","Bike Sprint"];

// Resolution order at render: exercise.rxLite/setsLite (user-set) → RECOVERY_MAP[name] → auto-derive.

  "Zone 2 Cardio":{rx:"30–40 min @ 60–68% HRmax (very easy)"},

  "Warm-up":{rx:"8–10 min very easy"},
  "Long Slow Distance":{rx:"40–50 min @ 60–68% HRmax (cut short)"},

const RIR_OPTS=["0 (F)","1","1-2","2","2-3","3","3-5"];
const REST_OPTS=[{label:"1:30",sec:90},{label:"3:00",sec:180},{label:"5:00",sec:300}];
const SEED_WEIGHTS={

  "Chest-Supported Row":[70,75,80,82.5,85,90],
  "Seated Cable Row":[70,80,90,100,110,120,130],

// History / PRs / weight memory stay keyed by date + exercise name, so they are shared

function seedPrograms(){const did='vo2max-low-vol';
  return {active:did,order:[did],list:{[did]:{name:'VO2Max + Low Vol Lifting',
    days:JSON.parse(JSON.stringify(DEFAULT_WORKOUTS)),dayOrder:Object.keys(DEFAULT_WORKOUTS)}}}}
// Deep-validate / self-heal the persisted (untrusted) programs blob so a partial or
// corrupt store can never brick boot or rendering. Falls back to a fresh seed only when
// the active program is wholly unrecoverable — logged history is never touched.
function sanitizePrograms(P){
  if(!P||typeof P!=='object'||!P.list||typeof P.list!=='object')return seedPrograms();
  Object.values(P.list).forEach(p=>{if(!p||typeof p!=='object')return;
    if(!p.name)p.name='Program';
    p.days=(p.days&&typeof p.days==='object')?p.days:{};
    p.dayOrder=Array.isArray(p.dayOrder)?p.dayOrder:Object.keys(p.days);
    Object.values(p.days).forEach(c=>{if(c&&typeof c==='object'&&!Array.isArray(c.exercises))c.exercises=[]});
    if(!p.cycle||typeof p.cycle!=='object')p.cycle={done:{},startISO:weekStartISO(),n:1};
    if(!p.cycle.done||typeof p.cycle.done!=='object')p.cycle.done={};});
  if(!Array.isArray(P.order))P.order=Object.keys(P.list);
  if(!P.active||!P.list[P.active]||!P.list[P.active].days)P.active=Object.keys(P.list)[0];
  if(!P.active||!P.list[P.active])return seedPrograms();
  return P;
}

// ─── Merge Upper A / Upper B duplicate-movement tracking ───
// Upper A and Upper B titled the SAME movement two slightly different ways, and because history / PRs /
// weight memory are keyed by exercise NAME (see the note by the storage block), that split one movement's
// weight+rep progression across the two days. Canonicalize each such pair to a single name so the two days
// share one progression line:
//   • "Neutral-Grip Pull-Ups" → "Pull-Ups"          (Upper A pull-up ≡ Upper B pull-up)
//   • "Chest-Supported Row"   → "Seated Cable Row"   (the old Upper A row — already renamed in the program
//                                                     by _plan3x3upperA, but past logs still sit under it)
// Genuinely distinct lifts are left untouched (rope pushdown vs. overhead extension, incline vs. hammer curl).
// UNLIKE the earlier renames — which deliberately left past logs where they were — this one also folds the
// logged history + weight memory onto the canonical name, because consolidating that past data is the whole
// point of the request. The paired names share a muscle group, so the volume/PR rollups are unchanged. The
// merge is a non-destructive UNION (sets are moved, or appended when both names have data on one date — never
// overwritten or dropped), and the whole pass is flag-guarded + idempotent (runs once).
if(!programs._upperMergeTracking){
  const MERGE={'Neutral-Grip Pull-Ups':'Pull-Ups','Chest-Supported Row':'Seated Cable Row'};
  // 1) Program definitions — rename in every seeded program's days, keeping the saved per-day order in sync.
  //    If a day already carries the canonical name, drop the duplicate synonym entry (its logged sets are
  //    preserved by the history merge in step 2).
  Object.values(programs.list||{}).forEach(p=>{if(!p||!p.days||typeof p.days!=='object')return;
    Object.keys(p.days).forEach(k=>{const d=p.days[k];if(!d||!Array.isArray(d.exercises))return;
      d.exercises=d.exercises.filter(e=>{const c=e&&MERGE[e.name];if(!c)return true;
        if(d.exercises.some(x=>x!==e&&x.name===c))return false; // canonical already present → drop synonym
        e.name=c;return true;});
      const ord=exerciseOrder[k];
      if(Array.isArray(ord))exerciseOrder[k]=ord.reduce((a,n)=>{const c=MERGE[n]||n;if(!a.includes(c))a.push(c);return a},[]);
    });
  });
  // Re-attach the grip cue Upper A used to carry in its name (guarded so a hand-edited rx is left alone).
  const uaPull=((programs.list[PLAN3x3_ID]||{}).days||{});
  const uaEx=(uaPull['Mon - Upper A']||{}).exercises||[];const up=uaEx.find(e=>e.name==='Pull-Ups');
  if(up&&up.rx==='2 × 6–10 | 1–2 RIR')up.rx="2 × 6–10 | 1–2 RIR (straight or neutral grip — whichever's comfortable)";
  // 2) Logged history — move each synonym's sets onto the canonical name per date; append (union) when both
  //    exist on one date so no session's sets are lost. Meta keys (_day/_extras/_recovery/…) are untouched.
  Object.keys(history).forEach(d=>{const rec=history[d];if(!rec||typeof rec!=='object')return;
    for(const syn in MERGE){const c=MERGE[syn];if(!Array.isArray(rec[syn]))continue;
      rec[c]=Array.isArray(rec[c])?rec[c].concat(rec[syn]):rec[syn];delete rec[syn];}});
  // 3) Weight memory — union the picker values onto the canonical name (sorted, capped at 15 like setData).
  for(const syn in MERGE){const c=MERGE[syn];if(!Array.isArray(weightMemory[syn]))continue;
    const m=[...new Set([...(weightMemory[c]||[]),...weightMemory[syn]])].sort((a,b)=>a-b);
    weightMemory[c]=m.length>15?m.slice(-15):m;delete weightMemory[syn];}
  programs._upperMergeTracking=true;save();
}

  editWorkout:null,newProgOpen:false,addWkOpen:false,exEditIdx:null,wkEditOpen:false};
function dk(){return V.date.toISOString().split('T')[0]}
function sess(){return history[dk()]||{}}
function exSets(n){return sess()[n]||[]}
function fmtDate(d){const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],w=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];return w[d.getDay()]+', '+m[d.getMonth()]+' '+d.getDate()}
function fmtMD(d){const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return m[d.getMonth()]+' '+d.getDate()}
function fmtTime(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function isToday(){const t=new Date(),d=V.date;return t.getFullYear()===d.getFullYear()&&t.getMonth()===d.getMonth()&&t.getDate()===d.getDate()}

// ─── EXERCISE ORDER ───
function getOrderedExercises(dayName){
  const cfg=PROGRAM[dayName];if(!cfg)return[];
  const prescribed=cfg.exercises;
  const extras=(sess()._extras||[]).filter(e=>!e.day||e.day===dayName).map(e=>({...e,isExtra:true})); // scope extras to their workout
  const all=[...prescribed,...extras];
  const order=exerciseOrder[dayName];
  if(!order)return all;
  // Sort by saved order, append any new exercises at end
  const ordered=[];
  order.forEach(name=>{const ex=all.find(e=>e.name===name);if(ex)ordered.push(ex)});
  all.forEach(ex=>{if(!ordered.find(e=>e.name===ex.name))ordered.push(ex)});
  return ordered;
}
function moveExercise(dayName,fromIdx,toIdx){
  const allEx=getOrderedExercises(dayName);
  if(toIdx<0||toIdx>=allEx.length)return;
  const item=allEx.splice(fromIdx,1)[0];
  allEx.splice(toIdx,0,item);
  exerciseOrder[dayName]=allEx.map(e=>e.name);
  save();render();
}

// ─── PROGRAM / WORKOUT / EXERCISE BUILDER ───
const ICON_CHOICES=['🏋️','💪','🫁','💨','🧘','🔥','🦵','🏃','🔄','⚡','🚴','🏊','🤸','🥊','⛰️','🧗'];
const COLOR_CHOICES=['#2563eb','#dc2626','#059669','#ea580c','#7c3aed','#0891b2','#db2777','#ca8a04','#16a34a','#6b7280'];
function uid(p){return (p||'x')+Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-2)}
function wkName(key){const p=String(key).split(' - ');return p.length>1?p.slice(1).join(' - '):key}
function wkLabel(key){const p=String(key).split(' - ');return p.length>1?p[0]:''}
function orderedWorkouts(){const pr=activeProg();const seen=new Set(),ks=[];
  (pr.dayOrder||[]).forEach(k=>{if(pr.days[k]&&!seen.has(k)){seen.add(k);ks.push(k)}});
  Object.keys(pr.days).forEach(k=>{if(!seen.has(k)){seen.add(k);ks.push(k)}});return ks}

function setActiveProgram(id){if(!programs.list[id])return;programs.active=id;PROGRAM=programs.list[id].days;V.day=null;save()}
function createProgram(name){const id=uid('prog');programs.list[id]={name:(name||'').trim()||'New Program',days:{},dayOrder:[]};
  programs.order=[...(programs.order||Object.keys(programs.list)).filter(x=>x!==id),id];setActiveProgram(id);return id}
function renameProgram(id,name){if(programs.list[id]&&(name||'').trim()){programs.list[id].name=name.trim();save()}}
function deleteProgram(id){if(Object.keys(programs.list).length<=1)return;delete programs.list[id];
  programs.order=(programs.order||[]).filter(x=>x!==id);
  if(programs.active===id){const rest=(programs.order||[]).filter(x=>programs.list[x]);setActiveProgram(rest[0]||Object.keys(programs.list)[0])}save()}

function addWorkout(name,icon,color){const pr=activeProg();let base=(name||'').trim()||'New Workout',disp=base,n=2;
  const taken=()=>Object.keys(pr.days).some(k=>wkName(k).toLowerCase()===disp.toLowerCase()); // dedupe on visible name
  while(taken()){disp=base+' '+n;n++}
  const key=disp;
  const order=orderedWorkouts(); // capture before inserting the new day
  pr.days[key]={color:color||'#6b7280',icon:icon||'🏋️',exercises:[]};
  pr.dayOrder=[...order,key];save();return key}
function updateWorkout(oldKey,name,icon,color){const pr=activeProg();const cfg=pr.days[oldKey];if(!cfg)return oldKey;
  if(icon)cfg.icon=icon;if(color)cfg.color=color;
  let key=oldKey;const fullNm=(name||'').trim();
  if(fullNm&&fullNm!==oldKey){
    const lbl=wkLabel(fullNm);let disp=wkName(fullNm),base=disp,n=2;
    const taken=()=>Object.keys(pr.days).some(k=>k!==oldKey&&wkName(k).toLowerCase()===disp.toLowerCase());
    while(taken()){disp=base+' '+n;n++}
    const cand=lbl?lbl+' - '+disp:disp;
    if(cand!==oldKey){key=cand;const order=orderedWorkouts(); // capture order (oldKey in place) before mutating days
      pr.days[key]=cfg;delete pr.days[oldKey];
      pr.dayOrder=order.map(k=>k===oldKey?key:k);
      if(exerciseOrder[oldKey]){exerciseOrder[key]=exerciseOrder[oldKey];delete exerciseOrder[oldKey]}}}
  save();return key}
function deleteWorkout(key){const pr=activeProg();delete pr.days[key];
  pr.dayOrder=(pr.dayOrder||[]).filter(k=>k!==key);delete exerciseOrder[key];save()}
function moveWorkout(key,dir){const ks=orderedWorkouts();const i=ks.indexOf(key),j=i+dir;
  if(i<0||j<0||j>=ks.length)return;ks.splice(j,0,ks.splice(i,1)[0]);activeProg().dayOrder=ks;save();render()}

function addWorkoutExercise(wkey,ex){const cfg=activeProg().days[wkey];if(!cfg)return false;
  const nm=(ex.name||'').trim();if(!nm)return false;
  if(cfg.exercises.some(e=>e.name===nm)){toast('Already in this workout');return false}
  const item={name:nm,rx:(ex.rx||'').trim(),type:ex.type||'strength',sets:ex.sets||(ex.type==='cardio'||ex.type==='mobility'?1:2)};
  if(ex.rxLite&&ex.rxLite.trim())item.rxLite=ex.rxLite.trim();
  if(ex.setsLite!=null&&ex.setsLite!=='')item.setsLite=Math.max(1,parseInt(ex.setsLite)||1);
  cfg.exercises.push(item);
  if(!customExercises.includes(nm)&&!COMMON_EXTRAS.includes(nm))customExercises.push(nm);save();return true}
function updateWorkoutExercise(wkey,idx,ex){const cfg=activeProg().days[wkey];if(!cfg||!cfg.exercises[idx])return false;
  const cur=cfg.exercises[idx];
  if(ex.name!=null){const nm=ex.name.trim()||cur.name;
    if(nm!==cur.name&&cfg.exercises.some((e,j)=>j!==idx&&e.name===nm)){toast('Already in this workout');return false}
    cur.name=nm}
  if(ex.rx!=null)cur.rx=ex.rx.trim();if(ex.type)cur.type=ex.type;if(ex.sets!=null)cur.sets=ex.sets;
  if(ex.rxLite!=null){const v=ex.rxLite.trim();if(v)cur.rxLite=v;else delete cur.rxLite}
  if(ex.setsLite!=null){if(ex.setsLite==='')delete cur.setsLite;else cur.setsLite=Math.max(1,parseInt(ex.setsLite)||1)}
  save();return true}
function deleteWorkoutExercise(wkey,idx){const cfg=activeProg().days[wkey];if(cfg&&cfg.exercises[idx]){cfg.exercises.splice(idx,1);save()}}
function moveWorkoutExercise(wkey,idx,dir){const cfg=activeProg().days[wkey];if(!cfg)return;
  const j=idx+dir;if(j<0||j>=cfg.exercises.length)return;cfg.exercises.splice(j,0,cfg.exercises.splice(idx,1)[0]);save();render()}

// ─── DATA HELPERS ───
function setData(exName,si,field,val){
  const d=dk();
  if(!history[d])history[d]={_day:V.day};
  if(history[d]._day==null&&V.day)history[d]._day=V.day; // attribute the day to the workout you log into
  if(!history[d][exName])history[d][exName]=[];
  while(history[d][exName].length<=si)history[d][exName].push({});
  history[d][exName][si][field]=val;
  if(field==='weight'&&val){
    const num=parseFloat(val);
    if(!isNaN(num)){if(!weightMemory[exName])weightMemory[exName]=[];
      if(!weightMemory[exName].includes(num)){weightMemory[exName].push(num);weightMemory[exName].sort((a,b)=>a-b);
        if(weightMemory[exName].length>15)weightMemory[exName]=weightMemory[exName].slice(-15)}}
  }
  save();
}
function setCardio(exName,field,val){
  const d=dk();
  if(!history[d])history[d]={_day:V.day};
  if(history[d]._day==null&&V.day)history[d]._day=V.day;
  if(!history[d][exName])history[d][exName]=[{}];
  if(!history[d][exName][0])history[d][exName][0]={};
  history[d][exName][0][field]=val;
  history[d][exName][0].type='cardio';
  save();
}
function getPrev(exName){
  const d=dk();
  for(const k of Object.keys(history).sort().reverse()){
    if(k===d)continue;const s=history[k]?.[exName];
    if(s?.length>0&&(s[0].weight||s[0].duration))return{date:k,sets:s}}
  return null;
}
// Notes for the ⓘ popup: the most recent PRIOR day this exercise carries a real note. Scans history
// directly (not getPrev, which requires weight/duration) so a note-only session — e.g. "skipped, back
// pain" with no load — still surfaces. Skips today and the '✓ Done' auto-mark.
function lastNotes(exName){
  const d=dk();
  for(const k of Object.keys(history).sort().reverse()){
    if(k===d)continue;const s=history[k]?.[exName];if(!Array.isArray(s))continue;
    const notes=[];
    s.forEach((set,i)=>{const t=(set&&set.notes||'').trim();if(t&&t!=='✓ Done')notes.push({set:i+1,note:t})});
    if(notes.length)return{date:k,notes};
  }
  return null;
}
// "PR" = the best single set by estimated 1RM (Epley: w·(1+reps/30)), NOT just the heaviest load — so
// progressing REPS at a fixed weight counts as a new PR, which is exactly how this program advances most
// lifts (double progression: add reps before load). Reps break exact e1RM ties, which is what ranks
// bodyweight / 0-load sets (every rep count estimates to 0 there). Returns the actual logged set, so the
// displayed "75lb × 12 reps" is always a real entry, never a computed number.
function getPR(exName){
  let best=null,bestE=-1,bestR=-1;
  Object.keys(history).forEach(d=>{const s=history[d]?.[exName];if(!Array.isArray(s))return;
    s.forEach(set=>{const w=parseFloat(set.weight);if(isNaN(w))return;
      const r=parseFloat(set.reps),reps=isNaN(r)?1:r,e1rm=w*(1+reps/30);
      if(e1rm>bestE||(e1rm===bestE&&reps>bestR)){bestE=e1rm;bestR=reps;best={weight:w,reps:set.reps||'?',date:d}}})});
  return best;
}
function getWeights(exName){
  let base=[...(SEED_WEIGHTS[exName]||FALLBACK_WEIGHTS)];
  const prev=getPrev(exName);
  if(prev)prev.sets.forEach(s=>{const w=parseFloat(s.weight);if(!isNaN(w)&&!base.includes(w))base.push(w)});
  const mem=weightMemory[exName];
  if(mem&&mem.length>0)mem.forEach(w=>{if(!base.includes(w))base.push(w)});
  const today=exSets(exName);
  today.forEach(s=>{const w=parseFloat(s.weight);if(!isNaN(w)&&!base.includes(w))base.push(w)});
  base=[...new Set(base)].sort((a,b)=>a-b);
  if(base.length>12){
    const recent=today.length>0?parseFloat(today[today.length-1].weight):(prev?.sets[0]?.weight?parseFloat(prev.sets[0].weight):null);
    if(recent){base.sort((a,b)=>Math.abs(a-recent)-Math.abs(b-recent));base=base.slice(0,12).sort((a,b)=>a-b)}
    else base=base.slice(-12);
  }
  return base;
}
// Sun→Sat window for the week containing `date`, anchored to LOCAL midnight so it never depends on
// the current time of day. (The old version carried V.date's time into the bounds, which dropped
// same-week Sunday sets whenever the app was opened after noon.) Logged days compare at noon.
function weekRange(date){
  const s=new Date(date.getFullYear(),date.getMonth(),date.getDate()-date.getDay());
  const e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6);e.setHours(23,59,59,999);
  return{start:s,end:e};
}
// Volume for the active program's CURRENT cycle: all sets logged on/after the cycle start date.
// (ISO YYYY-MM-DD strings compare lexically, so d>=start is a safe date compare.) Resets with the cycle.
function weeklyVol(){
  const start=progCycle().startISO||weekStartISO();const vol={};
  Object.keys(history).forEach(d=>{if(d<start)return;
    Object.keys(history[d]).forEach(ex=>{if(ex.startsWith('_'))return;
      (MUSCLE_MAP[ex]||[]).forEach(m=>{const sets=Array.isArray(history[d][ex])?history[d][ex].filter(s=>s.weight||s.reps):[];vol[m]=(vol[m]||0)+sets.length})})});
  return vol;
}
// ─── ROUTINE CYCLE (day-agnostic completion) ───
// Completion is a per-program checklist, NOT a calendar week: a workout is "done this cycle" only when
// you tap Finish in its session (so substitutions count — it credits the session, not exercise names).
// "New cycle" clears the checklist and stamps a fresh start date (which the volume rollup counts from),
// so the routine advances only when you decide the set is complete — never on a calendar boundary.
function weekStartISO(){const n=new Date();const s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-n.getDay());return s.toISOString().split('T')[0]}
function progCycle(p){p=p||activeProg();if(!p.cycle||typeof p.cycle!=='object')p.cycle={done:{},startISO:weekStartISO(),n:1};
  if(!p.cycle.done||typeof p.cycle.done!=='object')p.cycle.done={};if(p.cycle.startISO==null)p.cycle.startISO=weekStartISO();return p.cycle}
function isWorkoutDone(dn){return !!progCycle().done[dn]}
function toggleWorkoutDone(dn){const c=progCycle();if(c.done[dn])delete c.done[dn];else c.done[dn]=dk();save()}
function startNewCycle(){const c=progCycle();c.done={};c.n=(c.n||1)+1;c.startISO=dk();save()}

// ─── RECOVERY (streamlined-day) MODE ───
// A day can be flagged as suboptimal-recovery. When on, sessions render a streamlined version of each
// exercise: fewer working sets and easier targets. The flag lives on the day's session record so it
// travels with JSON export/import and is remembered per date.
function isRecovery(){return sess()._recovery===true}
function toggleRecovery(){const d=dk();
  if(!(history[d]&&history[d]._recovery)){if(!history[d])history[d]={_day:V.day};history[d]._recovery=true;}
  else{delete history[d]._recovery;
    // Drop a session record we created only to hold the flag (no exercises / extras logged).
    if(Object.keys(history[d]).filter(k=>k!=='_day').length===0)delete history[d];}
  save();render();}
// Streamlined set count: explicit setsLite → RECOVERY_MAP → auto (≈half of `base`, min 1).
// `base` is the already-block-adjusted target so recovery composes on top of periodization.
function liteSets(ex,base){
  if(ex.setsLite!=null&&ex.setsLite!=='')return Math.max(1,parseInt(ex.setsLite)||1);
  const m=RECOVERY_MAP[ex.name];if(m&&m.sets!=null)return Math.max(1,m.sets);
  base=(base==null)?(ex.sets||2):base;
  return ex.type==='strength'?Math.max(1,Math.ceil(base/2)):(base||1);
}
// Streamlined prescription text, or null to keep the normal rx (just with fewer sets).
function liteRx(ex){
  if(ex.rxLite&&ex.rxLite.trim())return ex.rxLite.trim();
  const m=RECOVERY_MAP[ex.name];if(m&&m.rx)return m.rx;
  return null;
}

// ─── PERIODIZATION BLOCKS (only for programs that define .blocks, e.g. the 3+3 plan) ───
function activeBlock(){const p=activeProg();if(!p||!Array.isArray(p.blocks)||!p.blocks.length)return null;
  return p.blocks.find(b=>b.id===p.activeBlock)||p.blocks[0]}
// Strength sets scaled by the active block's multiplier (deloads/taper reduce volume); cardio unchanged.
function blockSets(ex){const b=activeBlock(),base=ex.sets||(ex.type==='strength'?2:1);
  if(!b||ex.type!=='strength')return base;
  return Math.max(1,Math.round(base*(b.setMult==null?1:b.setMult)))}
// Per-block prescription override for a specific exercise (mostly cardio swaps), or null for the base rx.
function blockRxFor(ex){const b=activeBlock();if(!b)return null;const o=BLOCK_OVERRIDES[b.id];return(o&&o[ex.name])||null}
// A "cut" phase (deload/taper) runs a reduced set multiplier. Bonus hypertrophy work is omitted in a
// cut phase or a recovery day, so accessory volume never crowds recovery when it matters least.
function blockIsCut(){const b=activeBlock();return !!b&&b.setMult!=null&&b.setMult<1}

// ─── REST TIMER ───
let restIv=null;
function startRest(dur){V.restDur=dur||V.restDur;V.restSec=V.restDur;V.restOn=true;
  if(restIv)clearInterval(restIv);
  restIv=setInterval(()=>{V.restSec--;if(V.restSec<=0){clearInterval(restIv);restIv=null;V.restOn=false}renderRestBar()},1000);
  renderRestBar();
}
function stopRest(){if(restIv)clearInterval(restIv);restIv=null;V.restOn=false;V.restSec=0;renderRestBar()}
function renderRestBar(){
  const el=document.getElementById('rest-bar');if(!el)return;
  if(!V.restOn){el.style.display='none';return}
  el.style.display='flex';
  el.querySelector('.rest-time').textContent=fmtTime(V.restSec);
  el.querySelector('.rest-time').className='rest-time'+(V.restSec<=5?' warn':'');
  el.querySelectorAll('.rest-opt').forEach(b=>{b.className='rest-btn rest-opt'+(parseInt(b.dataset.sec)===V.restDur?' on':'')});
}

let toastTimer=null;
function toast(msg){clearTimeout(toastTimer);
  let el=document.getElementById('toast-el');
  if(!el){el=document.createElement('div');el.id='toast-el';el.className='toast';document.getElementById('app').appendChild(el)}
  el.textContent=msg;el.style.display='block';toastTimer=setTimeout(()=>{el.style.display='none'},1600)}

function h(tag,attrs,...ch){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class')el.className=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else el.setAttribute(k,v)});
  ch.flat().forEach(c=>{if(c!=null)el.appendChild(typeof c==='string'?document.createTextNode(c):c)});
  return el;
}

// ─── RENDER ───
function render(){const app=document.getElementById('app');
  try{app.innerHTML='';
    if(V.view==='home')renderHome(app);
    else if(V.view==='session')renderSession(app);
    else if(V.view==='programs')renderPrograms(app);
    else if(V.view==='progEdit')renderProgramEditor(app);
    else if(V.view==='workoutEdit')renderWorkoutEditor(app);}
  catch(err){console.error(err);app.innerHTML='';
    app.appendChild(h('div',{style:{padding:'40px 20px',color:'#ddd',textAlign:'center'}},
      h('div',{style:{fontSize:'14px',marginBottom:'4px'}},'Something went wrong.'),
      h('div',{style:{fontSize:'11px',color:'#666',marginBottom:'16px'}},'Your data is safe on this device.'),
      h('button',{class:'data-btn',style:{maxWidth:'200px',margin:'0 auto'},onClick:()=>{V.view='home';V.openEx=null;V.showAdd=false;V.reorder=false;render()}},'Reset view')))}}
window.addEventListener('error',()=>{try{const app=document.getElementById('app');if(app&&!app.firstChild){V.view='home';V.openEx=null;render()}}catch(_){}});

function renderHome(app){
  const today=isToday();
  app.appendChild(h('div',{class:'header'},
    h('div',{style:{display:'flex',alignItems:'baseline',gap:'6px'}},
      h('span',{class:'logo'},'IRON·LOG'),
      h('span',{style:{fontSize:'9px',color:'#666',fontWeight:700,letterSpacing:'0.5px',fontFamily:'monospace'}},APP_VERSION)),
    h('div',{style:{display:'flex',alignItems:'center',gap:'6px'}},
      h('button',{style:{background:'none',border:'none',fontSize:'14px',cursor:'pointer',padding:'2px 6px'},onClick:()=>{V.showData=!V.showData;render()}},'⚙️'),
      h('div',{class:'date-chip'},fmtDate(V.date)))));

  if(V.showData){
    const cnt=Object.keys(history).length;
    app.appendChild(h('div',{class:'data-panel'},
      h('div',{style:{fontSize:'11px',fontWeight:700,color:'#777',marginBottom:'8px',letterSpacing:'1px'}},'DATA ('+cnt+' sessions)'),
      h('div',{style:{display:'flex',gap:'8px',marginBottom:'8px'}},
        h('button',{class:'data-btn',onClick:exportXlsx},'📊 Excel'),
        h('button',{class:'data-btn',onClick:exportJson},'↓ JSON'),
        h('button',{class:'data-btn',onClick:importJson},'↑ Import')),
      cnt>0?h('button',{class:'remove-btn',onClick:()=>{if(confirm('Delete ALL logged data? (Your programs are kept)')){history={};customExercises=[];weightMemory={};exerciseOrder={};save();V.showData=false;toast('Cleared');render()}}},'Clear All Data'):null,
      h('div',{style:{marginTop:'8px',fontSize:'10px',color:'#444',lineHeight:'1.6'}},'Version '+APP_VERSION+' · Data saved to this device via localStorage.')));
  }

  app.appendChild(h('button',{class:'prog-bar',onClick:()=>{V.view='programs';V.newProgOpen=false;render()}},
    h('div',{style:{flex:1,minWidth:0}},
      h('div',{class:'plabel'},'PROGRAM'),
      h('div',{class:'pname'},activeProg().name)),
    h('span',{style:{color:'#777',fontSize:'11px',fontWeight:600,whiteSpace:'nowrap'}},'switch ▾')));

  // Periodization drop-down — only for programs that define phases (the 3+3 plan).
  const _blks=activeProg().blocks;
  if(Array.isArray(_blks)&&_blks.length){
    const cur=activeBlock();
    const sel=h('select',{class:'block-select',onchange:e=>{activeProg().activeBlock=e.target.value;save();render()}});
    _blks.forEach(bl=>{const o=h('option',{value:bl.id},bl.label);if(bl.id===cur.id)o.selected='selected';sel.appendChild(o)});
    app.appendChild(h('div',{class:'block-bar'},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'8px',marginBottom:'6px'}},
        h('span',{style:{fontSize:'9px',color:'#777',letterSpacing:'1.5px',fontWeight:700}},'PERIODIZATION BLOCK'),
        sel),
      h('div',{class:'block-note'},cur.note)));
  }

  app.appendChild(h('div',{class:'date-nav'},
    h('button',{class:'date-btn',onClick:()=>{V.date=new Date(V.date);V.date.setDate(V.date.getDate()-1);render()}},'◀'),
    h('button',{class:'date-btn'+(today?' today-glow':''),style:{fontSize:'11px',padding:'6px 14px'},onClick:()=>{V.date=new Date();render()}},'TODAY'),
    h('button',{class:'date-btn',onClick:()=>{V.date=new Date(V.date);V.date.setDate(V.date.getDate()+1);render()}},'▶')));

        h('div',{class:'vol-header'},h('span',{style:{color:'#aaa'}},m),h('span',{style:{color:'var(--green)',fontWeight:600,fontFamily:'monospace'}},String(wv[m]))),

    scroll.appendChild(card);

function renderSession(app){

      ...REST_OPTS.map(o=>h('button',{class:'rest-btn rest-opt'+(V.restDur===o.sec?' on':''),'data-sec':String(o.sec),onClick:()=>startRest(o.sec)},o.label)),

  if(rec)list.appendChild(h('div',{style:{margin:'2px 2px 10px',padding:'8px 10px',background:'#f59e0b12',border:'1px solid #f59e0b30',borderRadius:'8px',color:'var(--amber)',fontSize:'11px',fontWeight:600,lineHeight:'1.5'}},
    '🌙 Recovery mode — streamlined: fewer working sets & easier targets. Tap 🌙 in the header to restore the full session.'));
  if(hiddenBonus)list.appendChild(h('div',{style:{margin:'2px 2px 10px',padding:'8px 10px',background:'#0c0c1a',border:'1px dashed var(--border)',borderRadius:'8px',color:'#8b93a2',fontSize:'11px',fontWeight:600,lineHeight:'1.5'}},
    '📉 '+hiddenBonus+' item'+(hiddenBonus>1?'s':'')+' hidden — '+(rec?'recovery day omits optional & explosive work':'deload/taper omits optional hypertrophy work')+'.'));

  allEx.forEach((ex,i)=>{
    const isOpen=V.openEx===i&&!V.reorder;
    const sets=exSets(ex.name);
    const hasData=sets.length>0&&(sets[0].weight||sets[0].reps||sets[0].notes||sets[0].duration);
    const preview=hasData&&ex.type==='strength'?sets.filter(s=>s.weight).map(s=>s.weight+'×'+(s.reps||'?')).join(' → '):'';
    // Prescription/sets layer: block override → recovery override (recovery wins when a day is flagged).
    const bRx=blockRxFor(ex);let rxShown=bRx||ex.rx;
    if(rec){const lr=liteRx(ex);if(lr)rxShown=lr;}
    const effBase=blockSets(ex);
    const baseSets=rec?liteSets(ex,effBase):effBase;

    const row=h('div',{class:'ex-row'});

        V.openEx=isOpen?null:i;V.curSet=0;render()}},
      h('div',{style:{flex:1}},
        h('div',{style:{display:'flex',alignItems:'center',gap:'6px'}},h('span',{class:'ex-name'},ex.name),ex.isExtra?h('span',{class:'extra-tag'},'EXTRA'):null,rec?h('span',{class:'extra-tag'},'🌙'):null),
        h('div',{class:'ex-rx'+(rec?' ':''),style:rec?{color:'var(--amber)'}:null},rxShown),
        (rec&&ex.type==='strength'&&baseSets<effBase)?h('div',{class:'ex-preview',style:{color:'var(--amber)'}},'🌙 streamlined to '+baseSets+' working set'+(baseSets===1?'':'s')+' (from '+effBase+')'):null,
        preview?h('div',{class:'ex-preview'},preview):null),
      h('div',{style:{display:'flex',alignItems:'center',gap:'6px'}},
        hasData?h('span',{style:{color:'var(--green)',fontSize:'13px'}},'✓'):null,
        V.reorder?null:h('span',{style:{color:'#444',fontSize:'15px',transform:isOpen?'rotate(90deg)':'none',transition:'transform .15s'}},'›')));
    row.appendChild(btn);
    if(!V.reorder)row.appendChild(h('button',{class:'info-btn',title:'Notes & cues',onClick:()=>{V.infoEx=ex.name;render()}},'ⓘ'));
    list.appendChild(row);

    if(isOpen){
      const panel=h('div',{class:'ex-panel'});
      const prev=getPrev(ex.name);const pr=getPR(ex.name);

      if(ex.type==='cardio'||ex.type==='mobility'){
        if(ex.type==='cardio'){
          if(prev){const ps=prev.sets[0]||{},parts=[];
            if(ps.duration)parts.push(ps.duration+'min');if(ps.speed)parts.push(ps.speed+'mph');if(ps.elevation)parts.push(ps.elevation+'ft');
            if(parts.length||ps.notes)panel.appendChild(h('div',{class:'ref-box'},h('div',{class:'label'},'LAST · '+prev.date),h('div',{class:'vals'},parts.join(' · ')+(ps.notes?' — '+ps.notes:''))))}
          const cur=sets[0]||{},grid=h('div',{class:'cardio-grid'});
          [['DURATION (min)','duration','45'],['SPEED (mph)','speed','4.2'],['ELEVATION (ft)','elevation','0']].forEach(([lbl,field,ph])=>{
            const f=h('div',{class:'cardio-field'});f.appendChild(h('label',null,lbl));
            const inp=h('input',{class:'inp',type:'number',inputMode:'decimal',placeholder:ph});
            inp.value=cur[field]||'';inp.addEventListener('blur',e=>setCardio(ex.name,field,e.target.value));
            f.appendChild(inp);grid.appendChild(f)});
          panel.appendChild(grid);
          panel.appendChild(h('label',{class:'field-label'},'NOTES'));
          const ni=h('textarea',{class:'inp',rows:'2',placeholder:'HR, pace, terrain...'});
          ni.value=cur.notes||'';ni.addEventListener('blur',e=>setCardio(ex.name,'notes',e.target.value));
          panel.appendChild(ni);
        } else {
          const cur=sets[0]||{};const ni=h('textarea',{class:'inp',rows:'2',placeholder:'Notes...'});
          ni.value=cur.notes||'';ni.addEventListener('blur',e=>setCardio(ex.name,'notes',e.target.value));panel.appendChild(ni)}
        panel.appendChild(h('button',{class:'quick-done',onClick:()=>{
          if(!sets[0]?.notes&&!sets[0]?.duration)setCardio(ex.name,'notes','✓ Done');
          V.openEx=null;toast('Logged ✓');render()}},'Mark Done ✓'));
      } else {
        // Reference box
        if(prev||pr){const box=h('div',{class:'ref-box'});
          if(prev){box.appendChild(h('div',{class:'label'},'LAST · '+prev.date));
            box.appendChild(h('div',{class:'vals'},...prev.sets.map((s,si)=>h('span',{style:{marginRight:'10px'}},'S'+(si+1)+': '+s.weight+'×'+s.reps+(s.rir?' @'+s.rir:'')))))}
          if(pr){box.appendChild(h('div',{class:'label',style:{marginTop:prev?'6px':'0'}},'ALL-TIME PR'));
            box.appendChild(h('div',{class:'vals pr'},pr.weight+'lb × '+pr.reps+' reps ('+pr.date+')'))}
          panel.appendChild(box)}

        // Count only real (non-empty) sets + the one you're on, so accidental taps / empty padding
        // can't inflate the count and strand you on phantom sets. Tab taps clamp to the next open slot.
        const filledSets=sets.filter(s=>s&&(s.weight||s.reps)).length;
        const num=Math.max(baseSets,filledSets,V.curSet+1);
        const tabs=h('div',{class:'set-tabs'});
        for(let si=0;si<=num;si++){const s=sets[si],filled=s&&(s.weight||s.reps);
          tabs.appendChild(h('button',{class:'set-tab'+(V.curSet===si?' active':filled?' done':''),onClick:()=>{V.curSet=Math.min(si,filledSets);render()}},si<num?'S'+(si+1):'+'))}
        panel.appendChild(tabs);

        const cur=sets[V.curSet]||{};const weights=getWeights(ex.name);const isLast=V.curSet>=num-1;

        // Weight
        panel.appendChild(h('label',{class:'field-label'},'WEIGHT'));
        const wr=h('div',{class:'quick-row'});
        weights.forEach(w=>{const b=h('button',{class:'q-btn'+(cur.weight==w?' on':''),onClick:()=>{
          setData(ex.name,V.curSet,'weight',w);wr.querySelectorAll('.q-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');
          const ci=panel.querySelector('.weight-custom');if(ci)ci.value=w}},String(w));wr.appendChild(b)});
        panel.appendChild(wr);
        const wi=h('input',{class:'inp weight-custom',type:'number',inputMode:'decimal',placeholder:'Custom weight',style:{marginBottom:'4px'}});
        wi.value=cur.weight||'';
        wi.addEventListener('blur',e=>{const val=e.target.value;if(val){setData(ex.name,V.curSet,'weight',parseFloat(val)||val);
          wr.querySelectorAll('.q-btn').forEach(x=>{x.classList.toggle('on',x.textContent==val)})}});
        panel.appendChild(wi);

        // Reps
        panel.appendChild(h('label',{class:'field-label'},'REPS'));
        const rr=h('div',{class:'quick-row'});
        [3,4,5,6,7,8,10,12,15,20].forEach(v=>{const b=h('button',{class:'q-btn'+(cur.reps==v?' on':''),style:{minWidth:'36px'},onClick:()=>{
          setData(ex.name,V.curSet,'reps',v);rr.querySelectorAll('.q-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');
          const ci=panel.querySelector('.reps-custom');if(ci)ci.value=v}},String(v));rr.appendChild(b)});
        panel.appendChild(rr);
        const ri2=h('input',{class:'inp reps-custom',type:'number',inputMode:'numeric',placeholder:'Custom reps',style:{marginBottom:'4px'}});
        ri2.value=cur.reps||'';
        ri2.addEventListener('blur',e=>{const val=e.target.value;if(val){setData(ex.name,V.curSet,'reps',parseInt(val)||val);
          rr.querySelectorAll('.q-btn').forEach(x=>{x.classList.toggle('on',x.textContent==val)})}});
        panel.appendChild(ri2);

        // RIR
        panel.appendChild(h('label',{class:'field-label'},'RIR'));
        const ir=h('div',{class:'quick-row'});
        RIR_OPTS.forEach(v=>{const b=h('button',{class:'q-btn'+(cur.rir===v?' on':''),onClick:()=>{
          setData(ex.name,V.curSet,'rir',v);ir.querySelectorAll('.q-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on')
          }},v);ir.appendChild(b)});
        panel.appendChild(ir);

        // Notes — a real, always-present text field (previously a dead "+ note" toggle that never
        // opened an input because its ' ' placeholder trimmed to empty).
        panel.appendChild(h('label',{class:'field-label'},'NOTES'));
        const ni=h('input',{class:'inp notes-input',type:'text',placeholder:'Form cue, tempo, pain, RPE…'});
        ni.value=(cur.notes||'').trim()===''?'':cur.notes; // don't surface a legacy ' ' placeholder
        // Guard the write so blurring an untouched field can't stamp a phantom {notes:''} session
        // (matches commit()); only persist when there's text or an existing note to clear.
        ni.addEventListener('blur',e=>{const v=e.target.value;if(v.trim()||cur.notes)setData(ex.name,V.curSet,'notes',v)});
        panel.appendChild(ni);

        // ─── Set actions ─── consistent "Complete set"; on the final set, explicit ways to close out.
        const commit=()=>{
          const cwi=panel.querySelector('.weight-custom');if(cwi&&cwi.value)setData(ex.name,V.curSet,'weight',parseFloat(cwi.value)||cwi.value);
          const cri=panel.querySelector('.reps-custom');if(cri&&cri.value)setData(ex.name,V.curSet,'reps',parseInt(cri.value)||cri.value);
          const cni=panel.querySelector('.notes-input');if(cni){const v=cni.value;if(v.trim()||cur.notes)setData(ex.name,V.curSet,'notes',v)}
        };
        if(!isLast){
          // More prescribed sets to go → one clear action that logs this set and advances to the next.
          panel.appendChild(h('button',{class:'next-btn',onClick:()=>{commit();startRest(V.restDur);V.curSet++;render()}},'Complete set'));
        } else {
          // Final set → log it (stay put), or explicitly add another set / move to the next exercise.
          panel.appendChild(h('button',{class:'next-btn',onClick:()=>{commit();startRest(V.restDur);toast(ex.name+' — set logged ✓');render()}},'Complete set'));
          panel.appendChild(h('div',{class:'set-actions'},
            h('button',{class:'sec-btn',onClick:()=>{commit();startRest(V.restDur);V.curSet++;render()}},'Add another set'),
            h('button',{class:'sec-btn',onClick:()=>{commit();startRest(V.restDur);toast(ex.name+' logged');V.openEx=i+1<allEx.length?i+1:null;V.curSet=0;render()}},'Next exercise')));
        }
      }
      if(ex.isExtra)panel.appendChild(h('button',{class:'remove-btn',onClick:()=>{removeExtra(ex.name);render()}},'Remove from session'));
      list.appendChild(panel);
    }
  });

  if(!V.reorder){
    list.appendChild(h('button',{style:wdone
        ?{width:'100%',marginTop:'6px',padding:'12px',borderRadius:'10px',fontSize:'14px',fontWeight:700,cursor:'pointer',background:'#0c1a0c',color:'var(--green)',border:'1px solid #22c55e40'}
        :{width:'100%',marginTop:'6px',padding:'13px',borderRadius:'10px',fontSize:'14px',fontWeight:700,cursor:'pointer',background:'var(--green)',color:'#04120a',border:'none'},
      onClick:()=>{toggleWorkoutDone(V.day);toast(isWorkoutDone(V.day)?'✓ Workout done':'Marked not done');render()}},
      wdone?'✓ Done this cycle · tap to undo':'✓ Finish workout'));
    list.appendChild(h('button',{class:'add-btn',style:{borderColor:V.showAdd?'var(--accent)':'#282838'},
      onClick:()=>{V.showAdd=!V.showAdd;V.addFilter='';V.addPermanent=false;render()}},V.showAdd?'✕ Cancel':'+ Add Exercise'));
    if(V.showAdd){
      const ap=h('div',{class:'add-panel'});
      const si=h('input',{class:'inp',type:'text',placeholder:'Search or type new exercise...',style:{marginBottom:'10px'}});

      si.addEventListener('input',e=>{V.addFilter=e.target.value;renderAddList(ap,allEx)});
      ap.appendChild(si);setTimeout(()=>si.focus(),50);
      // Default: added lifts are transient (this session only). Check this to keep it in the workout.

        cb,h('span',null,'Add to this workout permanently ',h('span',{style:{color:'#666'}},'(otherwise just this session)'))));
      ap.appendChild(h('div',{id:'add-list-container'}));

  }
  scroll.appendChild(list);app.appendChild(scroll);
  renderInfoModal(app);
}

// ─── ⓘ EXERCISE INFO SHEET ─── last-session notes + curated set-up / mind-muscle cues.
function renderInfoModal(app){
  if(!V.infoEx)return;
  const name=V.infoEx,cue=CUES[name],ln=lastNotes(name);
  const close=()=>{V.infoEx=null;render()};
  const card=h('div',{class:'modal-card',onClick:e=>e.stopPropagation()},
    h('div',{class:'modal-head'},
      h('div',{class:'modal-title'},name),
      h('button',{class:'modal-x',onClick:close},'✕')));
  const notesSec=h('div',{class:'modal-sec'},h('div',{class:'ml'},'YOUR NOTES · LAST SESSION'));
  if(ln&&ln.notes.length){
    ln.notes.forEach(n=>notesSec.appendChild(h('div',{class:'modal-note'},(ln.notes.length>1?'S'+n.set+' — ':'')+n.note)));
    notesSec.appendChild(h('div',{class:'modal-empty',style:{marginTop:'2px'}},'from '+ln.date));
  } else if(ln){
    notesSec.appendChild(h('div',{class:'modal-empty'},'No notes logged on '+ln.date+' — add one in the NOTES field while logging.'));
  } else {
    notesSec.appendChild(h('div',{class:'modal-empty'},'No history yet — notes you log will show up here next time.'));
  }
  card.appendChild(notesSec);
  if(cue&&cue.setup)card.appendChild(h('div',{class:'modal-sec'},h('div',{class:'ml'},'SET-UP'),h('div',{class:'mb'},cue.setup)));
  if(cue&&cue.focus)card.appendChild(h('div',{class:'modal-sec'},h('div',{class:'ml'},'MIND–MUSCLE FOCUS'),h('div',{class:'mb'},cue.focus)));

function renderAddList(ap,allEx){

  const allNames=allEx.map(e=>e.name);

    .filter(n=>!allNames.includes(n)&&(!V.addFilter||n.toLowerCase().includes(V.addFilter.toLowerCase())));
  if(V.addFilter&&!filtered.find(n=>n.toLowerCase()===V.addFilter.toLowerCase())){
    const row=h('div',{style:{display:'flex',gap:'6px',marginBottom:'8px'}});
    row.appendChild(h('button',{class:'custom-add',style:{flex:1},onClick:()=>addExtra2(V.addFilter,'strength')},'+ "'+V.addFilter+'" 🏋️'));

  const ol=h('div',{style:{maxHeight:'220px',overflow:'auto',WebkitOverflowScrolling:'touch'}});
  filtered.slice(0,20).forEach(name=>{ol.appendChild(h('button',{class:'extra-opt',onClick:()=>addExtra2(name)},
    h('span',null,name),h('span',{style:{color:'#444',fontSize:'10px'}},(MUSCLE_MAP[name]||[]).join(', '))))});

function addExtra2(name,type){
  const d=dk();if(!history[d])history[d]={_day:V.day};if(history[d]._day==null&&V.day)history[d]._day=V.day;
  // "Add to workout" checked → make it a permanent part of THIS workout's template (shows every session).
  if(V.addPermanent){
    const ok=addWorkoutExercise(V.day,{name,rx:'',type:type||'strength',sets:(type==='cardio'||type==='mobility')?1:2});
    if(ok===false)return; // duplicate (toast already shown)
    V.showAdd=false;V.addFilter='';V.addPermanent=false;toast(name+' added to workout');render();return;
  }
  // Otherwise a transient extra: just for this workout, this day (does not persist to other days/workouts).
  if(!history[d]._extras)history[d]._extras=[];
  if(history[d]._extras.find(e=>e.name===name&&(e.day||V.day)===V.day))return;
  history[d]._extras.push({name,rx:'Custom',type:type||'strength',sets:3,day:V.day});
  if(!customExercises.includes(name)&&!COMMON_EXTRAS.includes(name))customExercises.push(name);
  V.showAdd=false;V.addFilter='';save();toast(name+' added (this session)');render();}
function removeExtra(exName){const d=dk();if(history[d]){history[d]._extras=(history[d]._extras||[]).filter(e=>!(e.name===exName&&(!e.day||e.day===V.day)));delete history[d][exName]}V.openEx=null;save()}

// ─── EXPORT / IMPORT ───
function exportJson(){const d=JSON.stringify({history,customExercises,weightMemory,exerciseOrder,programs,exportedAt:new Date().toISOString()},null,2);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download='ironlog-'+dk()+'.json';a.click();toast('Exported!')}
function importJson(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);
      if(d.history)Object.keys(d.history).forEach(k=>{if(!history[k])history[k]=d.history[k];else Object.keys(d.history[k]).forEach(ex=>{if(!history[k][ex])history[k][ex]=d.history[k][ex]})});
      if(d.customExercises)customExercises=[...new Set([...customExercises,...d.customExercises])];
      if(d.weightMemory)Object.keys(d.weightMemory).forEach(k=>{if(!weightMemory[k])weightMemory[k]=d.weightMemory[k];else weightMemory[k]=[...new Set([...weightMemory[k],...d.weightMemory[k]])].sort((a,b)=>a-b)});
      if(d.exerciseOrder)Object.keys(d.exerciseOrder).forEach(k=>{if(!exerciseOrder[k])exerciseOrder[k]=d.exerciseOrder[k]});
      if(d.programs&&d.programs.list){const idMap={};
        Object.keys(d.programs.list).forEach(id=>{const p=d.programs.list[id];if(!p||typeof p!=='object')return;
          let nid=id;if(programs.list[nid]){nid=uid('prog');p.name=(p.name||'Program')+' (imported)'} // rename on id collision (e.g. seed id) instead of dropping
          idMap[id]=nid;programs.list[nid]=p});
        const inOrder=(d.programs.order||Object.keys(d.programs.list)).map(id=>idMap[id]).filter(Boolean);
        programs.order=[...new Set([...(programs.order||[]),...inOrder])].filter(id=>programs.list[id]);
        programs=sanitizePrograms(programs);PROGRAM=activeProg().days}
      save();toast('Imported!');render()}catch{toast('Invalid file')}};r.readAsText(f)};inp.click()}
// SheetJS is loaded on demand (only when exporting to Excel) to keep first paint fast.
const XLSX_URL='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
let _xlsxP=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(_xlsxP)return _xlsxP;
  _xlsxP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=XLSX_URL;s.crossOrigin='anonymous';s.onload=()=>res(window.XLSX);s.onerror=()=>{_xlsxP=null;rej()};document.head.appendChild(s)});
  return _xlsxP;
}
async function exportXlsx(){
  let XLSX;try{XLSX=await loadXLSX()}catch{toast('Excel CDN unavailable — use JSON export');return}
  const wb=XLSX.utils.book_new();
  const rows=[['Date','Day','Exercise','Set','Weight','Reps','RIR','Duration','Speed','Elevation','Notes','Muscles']];
  Object.keys(history).sort().forEach(d=>{const s=history[d],day=(s._day||'').split(' - ')[1]||'';
    Object.keys(s).forEach(ex=>{if(ex.startsWith('_'))return;const sets=s[ex];if(!Array.isArray(sets))return;
      sets.forEach((st,si)=>{rows.push([d,day,ex,st.type==='cardio'?'—':si+1,st.weight||'',st.reps||'',st.rir||'',st.duration||'',st.speed||'',st.elevation||'',st.notes||'',(MUSCLE_MAP[ex]||[]).join(', ')])})})});
  const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:12},{wch:20},{wch:28},{wch:5},{wch:8},{wch:5},{wch:6},{wch:8},{wch:6},{wch:8},{wch:30},{wch:18}];
  XLSX.utils.book_append_sheet(wb,ws,'Training Log');
  const volCols=Object.keys(VOL_TARGETS); // every tracked muscle, so the sheet matches the in-app rollup
  const vr=[['Week',...volCols]];
  const dates=Object.keys(history).sort();
  if(dates.length){const first=new Date(dates[0]+'T12:00:00'),last=new Date(dates[dates.length-1]+'T12:00:00');
    const ws2=new Date(first);ws2.setDate(first.getDate()-first.getDay());
    while(ws2<=last){const we=new Date(ws2);we.setDate(ws2.getDate()+6);const vol={};
      dates.forEach(d=>{const dt=new Date(d+'T12:00:00');if(dt>=ws2&&dt<=we)Object.keys(history[d]).forEach(ex=>{if(ex.startsWith('_'))return;
        (MUSCLE_MAP[ex]||[]).forEach(m=>{const sets=Array.isArray(history[d][ex])?history[d][ex].filter(s=>s.weight||s.reps):[];vol[m]=(vol[m]||0)+sets.length})})});
      vr.push([ws2.toISOString().split('T')[0],...volCols.map(m=>vol[m]||0)]);ws2.setDate(ws2.getDate()+7)}}
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(vr),'Weekly Volume');
  // Best set by estimated 1RM (Epley), matching the in-app ALL-TIME PR so the sheet agrees with the app.
  const pr=[['Exercise','Weight','Reps','Date','Est. 1RM','Muscles']];const pm={};
  dates.forEach(d=>{Object.keys(history[d]).forEach(ex=>{if(ex.startsWith('_'))return;
    (history[d][ex]||[]).forEach(s=>{const w=parseFloat(s.weight);if(isNaN(w))return;
      const r=parseFloat(s.reps),reps=isNaN(r)?1:r,e=w*(1+reps/30);
      if(!pm[ex]||e>pm[ex].e||(e===pm[ex].e&&reps>pm[ex].reps))pm[ex]={w,r:s.reps||'',d,e,reps}})})});
  Object.keys(pm).sort().forEach(ex=>pr.push([ex,pm[ex].w,pm[ex].r,pm[ex].d,Math.round(pm[ex].e*10)/10,(MUSCLE_MAP[ex]||[]).join(', ')]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(pr),'PRs');
  XLSX.writeFile(wb,'IronLog-'+dk()+'.xlsx');toast('Excel exported!')}

}
